<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Check-In</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body style="text-align:center;font-family:Arial,sans-serif;padding:20px;">
  <h2>QR Check-In</h2>

  <div id="reader" style="width:320px;max-width:100%;margin:0 auto 20px auto;"></div>

  <div style="max-width:420px;margin:0 auto;text-align:left;">
    <label style="font-weight:bold;display:block;margin-bottom:8px;">Scanned value</label>
    <textarea id="scannedText" rows="4" style="width:100%;padding:10px;box-sizing:border-box;" readonly></textarea>

    <button id="checkInBtn" style="margin-top:12px;padding:12px 20px;font-size:16px;cursor:pointer;" disabled>
      Check In
    </button>

    <div id="resultBox" style="margin-top:20px;"></div>
  </div>

  <script>
    const flowUrl = "https://f0e3c06ec378e576bef89b03e45d43.81.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/604430a75a6c471b9e34349ce70ca1f7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=k3AECdPl2iIkAI9d958l20oQaKt7QSmHZ3XxMkr_2uk";

    let latestDecodedText = "";

    function renderInfo(message, color = "#111827") {
      const box = document.getElementById("resultBox");
      box.innerHTML = `
        <div style="background:#f3f4f6;border:1px solid #d1d5db;padding:14px;border-radius:8px;color:${color};white-space:pre-line;">
          ${message}
        </div>
      `;
    }

    function renderSuccess(data) {
      const box = document.getElementById("resultBox");
      box.innerHTML = `
        <div style="background:#ecfdf5;border:1px solid #10b981;padding:16px;border-radius:8px;color:#065f46;">
          <div style="font-size:18px;font-weight:bold;margin-bottom:10px;">Checked In</div>
          <div><strong>Name:</strong> ${data.employeeName || "-"}</div>
          <div><strong>ID:</strong> ${data.employeeId || "-"}</div>
          <div><strong>Time:</strong> ${data.time || "-"}</div>
        </div>
      `;
    }

    function renderError(message) {
      const box = document.getElementById("resultBox");
      box.innerHTML = `
        <div style="background:#fef2f2;border:1px solid #ef4444;padding:16px;border-radius:8px;color:#991b1b;">
          <div style="font-size:18px;font-weight:bold;margin-bottom:8px;">Error</div>
          <div>${message}</div>
        </div>
      `;
    }

    function extractToken(decodedText) {
      try {
        const parsed = JSON.parse(decodedText);
        return parsed.token || "";
      } catch (e) {
        return decodedText || "";
      }
    }

    function onScanSuccess(decodedText) {
      if (!decodedText) return;

      latestDecodedText = decodedText;
      document.getElementById("scannedText").value = decodedText;
      document.getElementById("checkInBtn").disabled = false;
      renderInfo("QR detected. Press Check In.", "#0a58ca");
    }

    function onScanFailure(error) {
    }

    async function startScanner() {
      try {
        const html5QrCode = new Html5Qrcode("reader");

        await html5QrCode.start(
          { facingMode: { exact: "environment" } },
          { fps: 10, qrbox: 250 },
          onScanSuccess,
          onScanFailure
        );

        renderInfo("Camera ready. Point it at the QR code.");
      } catch (err) {
        try {
          const html5QrCode = new Html5Qrcode("reader");

          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess,
            onScanFailure
          );

          renderInfo("Camera ready. Point it at the QR code.");
        } catch (err2) {
          renderError("Camera error: " + err2);
          console.error(err2);
        }
      }
    }

    document.getElementById("checkInBtn").addEventListener("click", async function () {
      const token = extractToken(latestDecodedText);

      if (!token) {
        renderError("No valid token found.");
        return;
      }

      this.disabled = true;
      renderInfo("Sending check-in...", "#0a58ca");

      try {
        const response = await fetch(flowUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: token,
            deviceName: "GitHubScanner"
          })
        });

        const data = await response.json();

        if (data.success) {
          renderSuccess(data);
        } else {
          renderError(data.message || "Check-in failed.");
        }
      } catch (err) {
        renderError("Error connecting to flow.");
        console.error(err);
      } finally {
        this.disabled = false;
      }
    });

    startScanner();
  </script>
</body>
</html>
